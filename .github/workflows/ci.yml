name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Webapp and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type checking
        run: |
          bun run --cwd packages/contracts typecheck
          bun run --cwd webapp typecheck

      - name: Lint
        run: bun run --cwd webapp lint

      - name: Contract tests
        run: bun run --cwd packages/contracts test

      - name: Webapp tests
        run: bun run --cwd webapp test

      - name: Build
        run: bun run --cwd webapp build

  engine:
    name: Decision engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Engine tests
        run: python -m unittest discover -s recsys/engine/tests -t .
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Independent evaluation tests
        run: python -m unittest discover -s recsys/eval -p 'test_*.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Scenario contract
        run: python recsys/validate.py

      - name: Card text contract
        run: python recsys/validate_explanation.py

      - name: Card mutation checks
        run: python recsys/eval_creatives.py
